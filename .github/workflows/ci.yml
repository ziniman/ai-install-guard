name: CI

# Every PR, so a stage stacked on another stage's branch is checked too.
on:
  pull_request:

permissions:
  contents: read

env:
  # The mod API is early access and changes between releases: bump on purpose.
  CLAUDE_CODE_VERSION: 2.1.308
  # The official marketplace commit the benchmark scans, and what it may
  # flag. Move them together, on purpose, after reading the new flags.
  OFFICIAL_MARKETPLACE_SHA: 58267944f92187b7d6a1c822165c96c81c864806
  OFFICIAL_MAX_RED: 0
  OFFICIAL_MAX_LOOK: 3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.js; do node --check "$f"; done

      - name: Fixtures module matches fixtures/
        run: |
          node scripts/build-fixtures.js
          git diff --exit-code hooks/test-support/fixtures.gen.ts || {
            echo "::error::hooks/test-support/fixtures.gen.ts is out of date. Run 'npm run build:fixtures' and commit the result."
            exit 1
          }

      - name: Plugin versions match package.json
        run: |
          node scripts/sync-versions.js
          git diff --exit-code .claude-plugin/ || {
            echo "::error::.claude-plugin/ versions differ from package.json. Bump with 'npm version', not by hand."
            exit 1
          }

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the plugin
        run: claude plugin validate --strict .

      - name: Run the mod's tests
        run: claude plugin test .

      # esbuild and Node's types for the chat skill, with no package's install script run.
      - name: Install build tools
        run: npm ci --ignore-scripts

      - name: Typecheck the command line
        run: npx tsc -p cli

      - name: Build and test the chat skill
        run: npm run test:skill

      # What an install gets: the files build-plugin.js ships from this commit,
      # as the release workflow will put them on the release branch. It must
      # load and pass the guard's own scan on its own, without the rest of the repo.
      - name: The plugin as it ships
        run: |
          node scripts/build-plugin.js --out "$RUNNER_TEMP/plugin"
          claude plugin validate --strict "$RUNNER_TEMP/plugin"
          node skill/ai-install-guard/scripts/scan.js "$RUNNER_TEMP/plugin" || {
            echo "::error::The plugin as it ships does not scan as No red flags (exit $?). Run 'node scripts/build-plugin.js --out <folder>' and scan that folder."
            exit 1
          }

      # The README badge names the content it was scanned at, so a PR that
      # changes anything refreshes it with `npm run badge`. This scans the
      # merged result with the scanner it builds.
      - name: README badge is for this version
        run: node scripts/badge.js --check

      - name: Keep the chat skill zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-install-guard-skill
          path: dist/ai-install-guard-skill.zip
          if-no-files-found: error

      # Anthropic's own marketplace, at one commit: well-made plugins that should
      # scan with no red flags. A change to the checks that makes them noisier
      # fails here. Its files are only read, never installed or run.
      - name: Fetch the official marketplace
        run: |
          mkdir -p "$RUNNER_TEMP/official"
          cd "$RUNNER_TEMP/official"
          git init -q
          git fetch -q --depth 1 https://github.com/anthropics/claude-plugins-official.git "$OFFICIAL_MARKETPLACE_SHA"
          git -c core.hooksPath=/dev/null checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OFFICIAL_MARKETPLACE_SHA"

      - name: Benchmark on the official marketplace
        run: |
          set -o pipefail
          {
            echo '### Official marketplace benchmark'
            echo '```'
            node scripts/benchmark.js "$RUNNER_TEMP/official" --max-red "$OFFICIAL_MAX_RED" --max-look "$OFFICIAL_MAX_LOOK" 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release preview
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Version is the unreleased placeholder (0.0.0). Merging will not publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Empty when the base branch has no package.json yet.
          BASE_VERSION=$( (git show "origin/${{ github.base_ref }}:package.json" 2>/dev/null || true) \
            | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf8')).version } catch { '' }")
          if [ "$VERSION" = "$BASE_VERSION" ]; then
            echo "Version unchanged ($VERSION). Merging will not publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if out=$(npm view "$NAME@$VERSION" version 2>&1); then
            echo "::error::$NAME@$VERSION is already on npm. Bump to a new version."
            exit 1
          elif ! grep -q E404 <<< "$out"; then
            echo "$out"
            echo "::error::Could not check npm for $NAME@$VERSION."
            exit 1
          fi
          if ! grep -q "^## v$VERSION " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v$VERSION' entry."
            exit 1
          fi
          echo "Merging will publish **$NAME@$VERSION** to npm and create release **v$VERSION**." >> "$GITHUB_STEP_SUMMARY"
